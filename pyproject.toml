[project]
name = "lass"
version = "0.1.0"
description = "LSST Alert Stream Simulator and Broker"
requires-python = ">=3.13"
authors = [
    { name = "Mohammed Chamma" }
]
dependencies = [
    "confluent-kafka>=2.14.2",
    "lsst-alert-packet",
    "matplotlib>=3.11.0",
    "tqdm>=4.68.3",
]

[project.scripts]
lass = "lass.lassproducer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
lsst-alert-packet = { git = "https://github.com/CanDIAPL/alert_packet.git" }
